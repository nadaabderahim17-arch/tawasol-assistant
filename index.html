
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TAWASOL Assistant</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #F6F4EE;
      font-family: Arial, sans-serif;
      color: #252B2D;
    }

    .container {
      max-width: 850px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      padding: 20px 10px;
    }

    .header h1 {
      color: #173B45;
      margin-bottom: 8px;
    }

    .header p {
      color: #526466;
      line-height: 1.7;
    }

    #voiceflow-chat {
      width: 100%;
      height: 680px;
      min-height: 550px;
      background: #FFFFFF;
      border: 1px solid #D9E6E2;
      border-radius: 16px;
      overflow: hidden;
    }

    @media (max-width: 600px) {
      body {
        padding: 10px;
      }

      #voiceflow-chat {
        height: 75vh;
        min-height: 500px;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <header class="header">
      <h1>TAWASOL | تواصل</h1>
      <p>
        Your AI-powered guide to Egyptian Sign Language
        and accessible communication.
      </p>
    </header>

    <div id="voiceflow-chat"></div>

  </main>

  <script type="text/javascript">
    (function(d, t) {
      var v = d.createElement(t);
      var s = d.getElementsByTagName(t)[0];

      v.onload = function() {
        window.voiceflow.chat.load({
          verify: {
            projectID: '6afdc7ffccead82d6db90ebc'
          },
          
          url: 'https://general-runtime.voiceflow.com',
          voice: {
            url: 'https://runtime-api.voiceflow.com'
          },
          render: {
            mode: 'embedded',
            target: document.getElementById('voiceflow-chat')
           });
      };

      v.src = 'https://cdn.voiceflow.com/widget-next/bundle.mjs';
      v.type = 'text/javascript';
      s.parentNode.insertBefore(v, s);

    })(document, 'script');
  </script>
</body>
</html>
